# ──────────────────────────────────────────────────────
# Nginx Reverse Proxy for TradeTalks Next.js App (VPS)
# Place this at: /etc/nginx/sites-available/tradetalks
# Then: sudo ln -sf /etc/nginx/sites-available/tradetalks /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# ──────────────────────────────────────────────────────

# Gzip compression — HUGE win for JS/CSS on mobile networks
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
  application/javascript
  application/json
  application/x-javascript
  text/css
  text/html
  text/javascript
  text/plain
  text/xml
  image/svg+xml
  font/woff
  font/woff2
  application/font-woff
  application/font-woff2;

upstream nextjs_app {
  server 127.0.0.1:3000;
  keepalive 64;
}

# HTTP → HTTPS redirect
server {
  listen 80;
  listen [::]:80;
  server_name forexchallenge.tradetalks.co.in www.forexchallenge.tradetalks.co.in;
  return 301 https://$host$request_uri;
}

# Main HTTPS server block
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name forexchallenge.tradetalks.co.in www.forexchallenge.tradetalks.co.in;

  # --- SSL (managed by certbot — paths may differ) ---
  ssl_certificate     /etc/letsencrypt/live/forexchallenge.tradetalks.co.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/forexchallenge.tradetalks.co.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # --- Security headers ---
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # --- Static Next.js assets: cache 1 year (immutable) ---
  location /_next/static/ {
    proxy_pass http://nextjs_app;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # --- Public images (trophy, logo, etc): cache 30 days ---
  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
    proxy_pass http://nextjs_app;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # --- All other requests → Next.js app ---
  location / {
    proxy_pass http://nextjs_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # Increase timeouts for slow API calls
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;

    # Buffer settings for faster response
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;
  }
}
